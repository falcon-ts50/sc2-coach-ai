spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 15s
    max-connections: 50
    threads:
      max: 20

sc2coach:
  analysis:
    python-executable: ${SC2_COACH_PYTHON:python3}
    decoder-script: ${SC2_COACH_DECODER_SCRIPT:../analyze.py}
    timeout: ${SC2_COACH_DECODER_TIMEOUT:2m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
