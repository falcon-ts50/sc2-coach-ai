<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <title>SC2 Match Review</title>
  <link rel="stylesheet" href="/src/report-refinement.css" />
</head>
<body>
  <div id="root"></div>
  <div id="build-info" style="position:fixed;right:12px;bottom:8px;z-index:1000;padding:5px 8px;border-radius:6px;background:rgba(7,17,31,.86);color:#8fa6bd;font:11px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;backdrop-filter:blur(8px)">build: loading…</div>
  <script>
    fetch('/api/v1/build', { cache: 'no-store' })
      .then(response => response.ok ? response.json() : Promise.reject())
      .then(info => {
        const commit = info.commit && info.commit !== 'unknown' ? info.commit.slice(0, 8) : 'unknown';
        document.getElementById('build-info').textContent = `v${info.version} · build ${info.build} · ${commit}`;
        document.getElementById('build-info').title = `Built ${info.buildTime}`;
      })
      .catch(() => { document.getElementById('build-info').textContent = 'build: unavailable'; });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
