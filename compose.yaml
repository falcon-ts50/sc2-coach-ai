services:
  sc2-coach:
    build: .
    image: sc2-coach-ai:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError"
      SC2_COACH_DECODER_TIMEOUT: "2m"
      HOME: "/tmp"
      MPLCONFIGDIR: "/tmp/matplotlib"
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /var/tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/actuator/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 20s
