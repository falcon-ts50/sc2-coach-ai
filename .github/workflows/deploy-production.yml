name: deploy-production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc2-coach-production
  cancel-in-progress: false

jobs:
  python-tests:
    name: python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/release_version.py --check-sync

  java-build:
    name: java and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Build React frontend
        working-directory: frontend
        run: npm install && npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test Java modules
        working-directory: java
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build production image
        run: docker build --build-arg APP_VERSION="$(cat VERSION)" -t sc2-coach-ai:ci .

  tag:
    name: tag release
    runs-on: ubuntu-latest
    needs: [python-tests, java-build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable release tag
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/release_version.py --check-sync)"
          TAG="v${VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already points to ${TAG_SHA}, not ${GITHUB_SHA}."
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "SC2 Coach ${VERSION}"
          git push origin "$TAG"

  deploy:
    name: deploy to nukle.nexus
    runs-on: ubuntu-latest
    needs: [tag]
    steps:
      - name: Prepare SSH
        env:
          SC2_DEPLOY_SSH_KEY: ${{ secrets.SC2_DEPLOY_SSH_KEY }}
          SC2_DEPLOY_KNOWN_HOSTS: ${{ secrets.SC2_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SC2_DEPLOY_SSH_KEY" > ~/.ssh/sc2-coach-deploy
          printf '%s\n' "$SC2_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/sc2-coach-deploy ~/.ssh/known_hosts
      - name: Rebuild production container
        env:
          SC2_DEPLOY_HOST: ${{ secrets.SC2_DEPLOY_HOST }}
          SC2_DEPLOY_USER: ${{ secrets.SC2_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/sc2-coach-deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SC2_DEPLOY_USER@$SC2_DEPLOY_HOST" \
            "sudo /usr/local/sbin/sc2-coach-deploy-main"
